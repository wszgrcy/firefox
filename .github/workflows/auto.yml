name: Build GeckoView for Android

on:
  push:
    branches: [build]
    paths:
      - '.github/workflows/auto.yml'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
env:
  IS_PROD: 1
  GECKOVIEW_VERSION: 156.0.22
  GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
  GPG_KEY_BASE64: ${{ secrets.GPG_KEY_BASE64 }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
jobs:
  Android-X86_64:
    runs-on: ubuntu-26.04
    steps:
      
      - run: |
          free -lh
      - name: Free Disk Space (Ubuntu)
        uses: BRAINSia/free-disk-space@v2
        with:
          tool-cache: true
          mandb: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24
      - name: Checkout gecko-dev
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            unzip \
            zip \
            wget \
            curl \
            git \
            file
      - name: Bootstrap toolchain
        run: |
          ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android"
        env:
          MOZ_AUTOMATION: 1
      - run: |
          ./mach doctor

      - name: Setup mozconfig
        run: |
          # 使用 > 覆盖写入，确保文件只包含以下两行
          cat > mozconfig <<EOF
          ac_add_options --enable-project=mobile/android
          ac_add_options MOZILLA_OFFICIAL=1
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --enable-update-channel=custom
          ac_add_options --enable-geckoview-lite
          EOF
          # （可选）显示内容以验证
          cat mozconfig
      - name: Build GeckoView
        run: |
          ./mach build
      - name: Create Maven bundle zip
        run: |
          cd obj-x86_64-unknown-linux-android/gradle/maven
          zip -r ${{ github.workspace }}/central-bundle-x86.zip io
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            central-bundle-x86.zip
          tag_name: ${{ env.GECKOVIEW_VERSION }}
      - name: Upload to Sonatype Central
        run: |
          curl --request POST \
            --verbose \
            --header 'Authorization: Bearer ${{ secrets.SONATYPE_TOKEN }}' \
            --form bundle=@central-bundle-x86.zip \
            https://central.sonatype.com/api/v1/publisher/upload




